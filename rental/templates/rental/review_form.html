{% extends "rental/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}: {{ hall.name }}</h1>
<form method="post" class="form" novalidate>
  {% csrf_token %}
  {% for field in form %}<div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}
  <button type="submit" class="btn">Сохранить</button> <a href="{% url 'rental:hall_detail' hall.slug %}">Отмена</a>
</form>
{% endblock %}
